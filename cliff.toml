# Config for https://git-cliff.org - generates CHANGELOG.md sections and
# GitHub release notes straight from commit messages. Requires every commit
# on `dev` (except merges and "chore: bump version"/"chore: release" ones,
# both explicitly skipped below) to start with `type: ` matching one of the
# groups in [git] commit_parsers - same convention already used in commit
# messages all session, just now load-bearing instead of cosmetic. See
# scripts/update-changelog.sh (local, pre-tag) and
# .github/workflows/release.yml (CI, post-tag) for the two places this runs.

[changelog]
header = """# Changelog

**Next up:** in-game verification is the main open item across the board -
see [docs/ROADMAP.md](docs/ROADMAP.md) for the full prioritized list.

**Entry format:** auto-generated by `git-cliff` from commit messages (see
`cliff.toml`) - one bullet per commit, grouped by its `type:` prefix
(`feature`/`fix`/`tweak`/`docs`/`debug`/`refactor`/`chore`). Write the
actual wording in the commit message, not here - this file (and each
GitHub release's notes) are a mechanical render of it, not a second
drafting pass.
"""
body = """
{% set repo_url = "https://github.com/gitepyc/CritLog" %}\
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]({{ repo_url }}/tree/{{ version | trim_start_matches(pat="v") }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% if previous.version %}[Full Changelog]({{ repo_url }}/compare/{{ previous.version | trim_start_matches(pat="v") }}...{{ version | trim_start_matches(pat="v") }}) [Previous Releases]({{ repo_url }}/releases)
{% else %}[Previous Releases]({{ repo_url }}/releases)
{% endif %}\
{% else %}\
    ## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}{% for commit in commits %}- **{{ group }}:** {% if group == "feature" %}{{ commit.message | trim_start_matches(pat="feat: ") | trim_start_matches(pat="feature: ") }}{% else %}{{ commit.message | trim_start_matches(pat=group ~ ": ") }}{% endif %}

{% endfor %}{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "[0-9]*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

# Only the first line of a commit message is ever shown - see the body
# template's `trim_start_matches`, which then drops the "type: " prefix
# itself since it's already shown as the bold group label.
commit_preprocessors = [
  { pattern = '\n\n[\s\S]*', replace = "" },
]

commit_parsers = [
  { message = "^chore: (bump version|release)\\b", skip = true },
  { message = "^Merge pull request", skip = true },
  { message = "^Merge branch", skip = true },
  { message = "^Revert", group = "revert" },
  # `feat:` accepted alongside `feature:` for TitanCritLine-imported history
  # only - write new commits as `feature:` (agreed unified vocabulary).
  { message = "^feat(ure)?:", group = "feature" },
  { message = "^fix:", group = "fix" },
  { message = "^tweak:", group = "tweak" },
  { message = "^debug:", group = "debug" },
  { message = "^docs:", group = "docs" },
  { message = "^refactor:", group = "refactor" },
  { message = "^chore:", group = "chore" },
  { message = ".*", group = "other" },
]
