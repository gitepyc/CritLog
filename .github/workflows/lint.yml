name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # luacheck is installed natively rather than through tests/lint/Dockerfile
      # (which scripts/lint.sh uses locally): container-based runners such as
      # Forgejo's don't provide a Docker CLI inside the job.
      - name: Install luacheck
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          $SUDO apt-get update -qq
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            lua5.1 liblua5.1-0-dev luarocks build-essential unzip
          $SUDO luarocks --lua-version=5.1 install luacheck

      - name: Run luacheck
        # luacheck exits 1 for warnings-only, 2+ for actual errors (e.g.
        # syntax errors). Only fail the build on real errors — known,
        # accepted warnings shouldn't turn every run red.
        run: |
          set +e
          luacheck .
          code=$?
          set -e
          echo "luacheck exit code: $code"
          if [ "$code" -ge 2 ]; then
            exit 1
          fi
