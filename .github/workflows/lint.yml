name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build lint image
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          IMAGE="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')-luacheck:5.1"
          echo "LUACHECK_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" -f tests/lint/Dockerfile tests/lint

      - name: Run luacheck
        # luacheck exits 1 for warnings-only, 2+ for actual errors (e.g.
        # syntax errors). Only fail the build on real errors — known,
        # accepted warnings shouldn't turn every run red.
        run: |
          set +e
          docker run --rm -v "$PWD":/addon:ro "$LUACHECK_IMAGE" .
          code=$?
          set -e
          echo "luacheck exit code: $code"
          if [ "$code" -ge 2 ]; then
            exit 1
          fi
