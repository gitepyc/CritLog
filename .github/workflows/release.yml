name: Package and release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2

      # packager's manual-changelog (.pkgmeta) dumps the entire CHANGELOG.md
      # into the release body it just created. Overwrites that body with
      # just this tag's own section (header incl. date/compare-link,
      # stripped, via cliff.toml).
      - name: Format release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # SemVer: a tag with a `-` (0.8.8-dev.1) is a prerelease, a plain
          # tag (0.8.8) is a real release.
          PRERELEASE=false
          case "$TAG" in
            *-*) PRERELEASE=true ;;
          esac

          # Explicit commit range (everything since the last real tag) for
          # prereleases and real releases alike, never `--current`: with
          # cliff.toml's ignore_tags, git-cliff's tag-boundary detection
          # breaks as soon as any -dev.N tag still exists inside the range
          # (empty notes for a real release, an error for a prerelease).
          # A real release's range naturally includes every -dev.N iteration
          # folded into it (see CONTRIBUTING.md).
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude '*-*' "$TAG^" 2>/dev/null || true)
          docker run --rm -v "$PWD":/repo -w /repo orhunp/git-cliff:latest \
            --config cliff.toml "${PREV_TAG:+$PREV_TAG..}$TAG" --strip header -o release-notes.md

          MAX_CHARS=4000
          if [ "$(wc -c < release-notes.md)" -gt "$MAX_CHARS" ]; then
            head -c "$MAX_CHARS" release-notes.md > release-notes.trunc.md
            printf '\n\n…truncated - see the full changelog: %s/blob/main/CHANGELOG.md\n' \
              "${{ github.server_url }}/${{ github.repository }}" >> release-notes.trunc.md
            mv release-notes.trunc.md release-notes.md
          fi

          gh release edit "$TAG" --notes-file release-notes.md --repo "$REPO" \
            --prerelease="$PRERELEASE" --latest="$([ "$PRERELEASE" = true ] && echo false || echo true)"
          rm -f release-notes.md
